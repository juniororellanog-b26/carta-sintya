<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una sorpresa para ti ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 450px;
      width: 100%;
      text-align: center;
    }
    .heart {
      font-size: 50px;
      color: #e63946;
      margin-bottom: 15px;
      animation: beat 1.2s infinite;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    h1 {
      color: #2b2d42;
      font-size: 24px;
      margin-bottom: 10px;
    }
    p {
      color: #555;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .btn {
      background-color: #e63946;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: #d62828;
    }
    .hidden-message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #ffe5ec;
      border-radius: 10px;
      color: #9d0208;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="heart">❤️</div>
    <h1>Para Sintya</h1>
    <p>Escribí esta carta especial para ti para recordar lo importante que eres para mí.</p>
    
    <button class="btn" onclick="mostrarMensaje()">Toca para abrir</button>

    <div id="mensaje" class="hidden-message">
      <p>¡Gracias por estar siempre ahí! Eres una persona muy especial. ✨</p>
    </div>
  </div>

  <script>
    function mostrarMensaje() {
      const elemento = document.getElementById('mensaje');
      if (elemento.style.display === 'block') {
        elemento.style.display = 'none';
      } else {
        elemento.style.display = 'block';
      }
    }
  </script>

</body>
</html>
